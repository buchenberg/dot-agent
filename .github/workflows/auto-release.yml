name: Auto Release (Conventional Commits)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # Prefer a PAT when repo/org policies restrict the default Actions token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package-and-upload:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      ASSET_NAME: dot-agent-dist-${{ needs.release-please.outputs.tag_name }}.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build dist/
        shell: bash
        run: |
          set -euo pipefail
          python tooling/sync.py --clean

          if [ ! -d "dist" ]; then
            echo "sync.py did not produce a dist/ directory."
            exit 1
          fi

          echo "Built dist/ contents:"
          find dist -mindepth 1 -maxdepth 2 -printf "%y %p\n" | sort

      - name: Create zip asset
        shell: bash
        run: |
          set -euo pipefail
          zip -r "${ASSET_NAME}" dist

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: ${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
