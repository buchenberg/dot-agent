name: Auto Release (Conventional Commits)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package-and-upload:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      ASSET_NAME: dot-agent-skills-${{ needs.release-please.outputs.tag_name }}.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .agent/skills package structure
        shell: bash
        run: |
          set -euo pipefail

          package_root="dist/package"
          target_skills_dir="$package_root/.agent/skills"
          source_skills_dir="skills"

          if [ ! -d "$source_skills_dir" ]; then
            echo "Expected source directory '$source_skills_dir' not found."
            exit 1
          fi

          mkdir -p "$target_skills_dir"
          cp -R "$source_skills_dir"/. "$target_skills_dir/"

          echo "Packaged skill directories:"
          find "$target_skills_dir" -mindepth 1 -maxdepth 1 -type d -printf "- %f\n" | sort

      - name: Create zip asset
        shell: bash
        run: |
          set -euo pipefail

          cd dist/package
          zip -r "../${ASSET_NAME}" ".agent"

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: dist/${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
