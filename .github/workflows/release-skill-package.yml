name: Package Dist For Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-dist:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    env:
      ASSET_NAME: dot-agent-dist-${{ github.event.release.tag_name }}.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build dist/
        shell: bash
        run: |
          set -euo pipefail
          python adapters/sync.py --clean

          if [ ! -d "dist" ]; then
            echo "sync.py did not produce a dist/ directory."
            exit 1
          fi

          echo "Built dist/ contents:"
          find dist -mindepth 1 -maxdepth 2 -printf "%y %p\n" | sort

      - name: Create zip asset
        shell: bash
        run: |
          set -euo pipefail
          zip -r "${ASSET_NAME}" dist

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
