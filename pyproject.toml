[project]
name = "dot-agent"
version = "0.4.1"
description = "Harness-agnostic content library for AI coding agents"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tooling/tests"]
python_files = ["test_*.py"]
addopts = "-ra"
